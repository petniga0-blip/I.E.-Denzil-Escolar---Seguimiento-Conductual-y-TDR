<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5b97d" />
      <stop offset="60%" stop-color="#c99450" />
      <stop offset="100%" stop-color="#ab7535" />
    </linearGradient>

    <!-- Arc text paths calibrated for perfect centering and radius -->
    <!-- Top arc: sweeping over top from ~135 deg to 45 deg -->
    <path id="textTop" d="M 130,400 A 270,270 0 1,1 670,400" fill="none" />
    <!-- Bottom arc: sweeping over bottom from ~225 deg to 315 deg -->
    <path id="textBottom" d="M 670,400 A 270,270 0 0,1 130,400" fill="none" />

    <clipPath id="innerCircle">
      <circle cx="400" cy="400" r="280" />
    </clipPath>
  </defs>

  <!-- Outermost Dark Border -->
  <circle cx="400" cy="400" r="395" fill="#1e293b" />

  <!-- Institutional Deep Navy Ring -->
  <circle cx="400" cy="400" r="388" fill="#223984" stroke="#1e293b" stroke-width="4" />

  <!-- Inner Scenic Landscape Circle -->
  <g clip-path="url(#innerCircle)">
    <!-- Sky -->
    <rect x="100" y="100" width="600" height="600" fill="url(#skyGrad)" />

    <!-- Clouds -->
    <ellipse cx="250" cy="330" rx="60" ry="22" fill="#ffffff" opacity="0.9" />
    <circle cx="230" cy="320" r="24" fill="#ffffff" opacity="0.9" />
    <circle cx="270" cy="322" r="22" fill="#ffffff" opacity="0.9" />

    <ellipse cx="550" cy="300" rx="65" ry="24" fill="#ffffff" opacity="0.9" />
    <circle cx="530" cy="290" r="25" fill="#ffffff" opacity="0.9" />
    <circle cx="575" cy="292" r="22" fill="#ffffff" opacity="0.9" />

    <ellipse cx="400" cy="340" rx="40" ry="16" fill="#ffffff" opacity="0.8" />

    <!-- Radiant Sun Rays -->
    <g stroke="#facc15" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <line x1="470" y1="360" x2="520" y2="220" />
      <line x1="470" y1="360" x2="570" y2="245" />
      <line x1="470" y1="360" x2="615" y2="290" />
      <line x1="470" y1="360" x2="640" y2="345" />
      <line x1="470" y1="360" x2="470" y2="195" />
      <line x1="470" y1="360" x2="425" y2="210" />
    </g>

    <!-- Rising Sun on Guajira Horizon -->
    <circle cx="470" cy="365" r="58" fill="url(#sunGrad)" />

    <!-- Divi-Divi Tree (Indigenous Guajira Tree) -->
    <!-- Trunk -->
    <path d="M 400,410 C 395,350 375,320 420,290 C 430,305 425,340 422,410 Z" fill="#854d0e" stroke="#451a03" stroke-width="2" />
    <path d="M 410,320 C 435,305 470,310 485,325" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
    <!-- Tree Foliage Canopy -->
    <path d="M 320,300 C 300,260 350,210 405,230 C 445,190 520,210 535,260 C 580,270 575,335 525,350 C 480,360 445,350 405,355 C 350,355 325,335 320,300 Z" fill="#15803d" stroke="#166534" stroke-width="3" />

    <!-- Flagpole and Flag -->
    <line x1="342" y1="180" x2="346" y2="410" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="342,176 346,168 350,176" fill="#334155" />
    <!-- Flag: Upper Sky Blue, Lower White -->
    <path d="M 346,215 C 370,200 385,225 412,205 L 412,260 C 385,280 370,255 346,270 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <path d="M 346,215 C 370,200 385,225 412,205 L 412,233 C 385,253 370,228 346,243 Z" fill="#0284c7" />

    <!-- Guajira Desert Dunes Ground -->
    <path d="M 100,420 Q 260,380 400,430 T 700,400 L 700,700 L 100,700 Z" fill="url(#sandGrad)" stroke="#92400e" stroke-width="2.5" />

    <!-- Green Saguaro Cactus on the right -->
    <!-- Center Trunk -->
    <path d="M 578,330 A 11,11 0 0,1 600,330 L 600,465 A 11,11 0 0,1 578,465 Z" fill="#16a34a" stroke="#15803d" stroke-width="2.5" />
    <!-- Left Arm -->
    <path d="M 564,360 A 7,7 0 0,1 578,360 L 578,405 C 578,415 582,420 590,420 L 590,432 C 572,432 564,420 564,405 Z" fill="#16a34a" stroke="#15803d" stroke-width="2.5" />
    <!-- Right Arm -->
    <path d="M 600,400 C 608,400 614,404 614,412 L 614,375 A 7,7 0 0,1 628,375 L 628,412 C 628,426 614,436 600,436 Z" fill="#16a34a" stroke="#15803d" stroke-width="2.5" />

    <!-- Open White Book of Knowledge in Foreground -->
    <g transform="translate(225, 375)">
      <!-- Shadow on sand -->
      <ellipse cx="175" cy="130" rx="155" ry="24" fill="#78350f" opacity="0.4" />

      <!-- White Book Pages -->
      <path d="M 175,115 C 135,100 75,98 25,112 L 45,35 C 90,26 140,32 175,45 C 210,32 260,26 305,35 L 325,112 C 275,98 215,100 175,115 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round" />
      
      <!-- Multi-page edge thickness -->
      <path d="M 25,112 C 75,100 135,102 175,118 C 215,102 275,100 325,112 L 318,124 C 270,113 215,115 175,129 C 135,115 80,113 32,124 Z" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
      
      <!-- Center Book Spine Line -->
      <line x1="175" y1="45" x2="175" y2="127" stroke="#0f172a" stroke-width="3" />

      <!-- Left Page: Progreso / Paz y -->
      <text x="100" y="64" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-4, 100, 64)">Progreso</text>
      <text x="92" y="94" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-3, 92, 94)">Paz</text>
      <text x="145" y="90" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#0f172a" text-anchor="middle">y</text>

      <!-- Right Page: Sabiduría / Cultura -->
      <text x="245" y="64" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(4, 245, 64)">Sabiduria</text>
      <text x="250" y="94" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(3, 250, 94)">Cultura</text>
    </g>
  </g>

  <!-- Inner Circle Dark Rim -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#0f172a" stroke-width="7" />

  <!-- Curved Text around the Blue Ring -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="900" fill="#ffffff" letter-spacing="4">
    <textPath href="#textTop" startOffset="50%" text-anchor="middle">INSTITUCIÓN EDUCATIVA</textPath>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#ffffff" letter-spacing="5">
    <textPath href="#textBottom" startOffset="50%" text-anchor="middle">DENZIL ESCOLAR</textPath>
  </text>
</svg>