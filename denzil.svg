<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42bcf4" />
      <stop offset="65%" stop-color="#9ee4fb" />
      <stop offset="100%" stop-color="#bfeefd" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea3d" />
      <stop offset="100%" stop-color="#f58220" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb479" />
      <stop offset="100%" stop-color="#c39659" />
    </linearGradient>
    <path id="textPathTop" d="M 105,300 A 195,195 0 0,1 495,300" fill="none" />
    <path id="textPathBottom" d="M 495,300 A 195,195 0 0,1 105,300" fill="none" />
    <clipPath id="innerCircleClip">
      <circle cx="300" cy="300" r="205" />
    </clipPath>
  </defs>

  <!-- Outer Black/Dark Ring -->
  <circle cx="300" cy="300" r="292" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Royal Blue Circular Border -->
  <circle cx="300" cy="300" r="286" fill="#2b3d8f" stroke="#1e293b" stroke-width="4" />

  <!-- Inner Circle Clipping for Scene -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Sky -->
    <rect x="90" y="90" width="420" height="420" fill="url(#skyGrad)" />

    <!-- Clouds -->
    <path d="M 140,240 Q 155,220 180,225 Q 200,210 225,230 Q 240,230 250,245 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 380,210 Q 400,190 425,195 Q 445,185 470,205 Q 485,210 495,225 Z" fill="#ffffff" opacity="0.85" />
    <path d="M 310,245 Q 330,230 350,235 Q 370,225 390,240 Z" fill="#ffffff" opacity="0.75" />

    <!-- Rising Sun Rays -->
    <g stroke="#ffe033" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="350" y1="270" x2="390" y2="160" />
      <line x1="350" y1="270" x2="430" y2="180" />
      <line x1="350" y1="270" x2="460" y2="220" />
      <line x1="350" y1="270" x2="480" y2="270" />
      <line x1="350" y1="270" x2="350" y2="140" />
      <line x1="350" y1="270" x2="310" y2="150" />
    </g>

    <!-- Rising Sun -->
    <circle cx="350" cy="270" r="42" fill="url(#sunGrad)" />

    <!-- Divi-Divi / Guajira Green Tree -->
    <!-- Trunk -->
    <path d="M 298,300 C 295,260 280,240 310,215 C 315,225 315,245 312,300 Z" fill="#8b4513" stroke="#5c2e0b" stroke-width="1.5" />
    <path d="M 305,235 C 325,225 350,230 360,240" fill="none" stroke="#5c2e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Tree Foliage -->
    <path d="M 235,215 C 220,185 260,150 300,165 C 330,135 385,150 395,185 C 430,195 425,240 390,250 C 355,260 330,250 300,255 C 260,255 240,240 235,215 Z" fill="#1e7e34" stroke="#145523" stroke-width="2" />

    <!-- Flagpole & Waving Flag -->
    <line x1="256" y1="130" x2="259" y2="295" stroke="#333333" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="256,128 259,122 262,128" fill="#111827" />
    <!-- Flag: Top blue, bottom white with waving curves -->
    <path d="M 258,155 C 275,145 285,165 305,150 L 305,190 C 285,205 275,185 258,195 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <path d="M 258,155 C 275,145 285,165 305,150 L 305,170 C 285,185 275,165 258,175 Z" fill="#0284c7" />

    <!-- Guajira Sand Dunes / Desert Ground -->
    <path d="M 80,310 Q 200,285 300,320 T 520,300 L 520,520 L 80,520 Z" fill="url(#sandGrad)" stroke="#9c723b" stroke-width="2" />

    <!-- Green Saguaro Cactus on the right -->
    <!-- Main stem -->
    <path d="M 436,250 A 8,8 0 0,1 452,250 L 452,340 A 8,8 0 0,1 436,340 Z" fill="#00a651" stroke="#006837" stroke-width="2" />
    <!-- Left Arm -->
    <path d="M 425,270 A 5,5 0 0,1 435,270 L 435,305 C 435,312 438,315 444,315 L 444,324 C 430,324 425,315 425,305 Z" fill="#00a651" stroke="#006837" stroke-width="2" />
    <!-- Right Arm -->
    <path d="M 453,300 C 459,300 463,303 463,308 L 463,280 A 5,5 0 0,1 473,280 L 473,308 C 473,318 463,326 453,326 Z" fill="#00a651" stroke="#006837" stroke-width="2" />

    <!-- Open White Book in Foreground -->
    <g transform="translate(170, 275)">
      <!-- Shadow -->
      <ellipse cx="130" cy="95" rx="115" ry="18" fill="#8a6534" opacity="0.4" />

      <!-- Book Pages -->
      <path d="M 130,85 C 100,75 55,73 20,83 L 35,25 C 70,18 105,22 130,32 C 155,22 190,18 225,25 L 240,83 C 205,73 160,75 130,85 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Pages thickness lines -->
      <path d="M 20,83 C 55,75 100,77 130,87 C 160,77 205,75 240,83 L 235,92 C 200,84 160,86 130,96 C 100,86 60,84 25,92 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
      
      <!-- Spine middle line -->
      <line x1="130" y1="32" x2="130" y2="92" stroke="#1e293b" stroke-width="2.5" />

      <!-- Book Text: Progreso Paz / Sabiduria Cultura -->
      <text x="75" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-4, 75, 46)">Progreso</text>
      <text x="68" y="68" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-3, 68, 68)">Paz</text>
      <text x="108" y="65" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#0f172a" text-anchor="middle">y</text>

      <text x="182" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(4, 182, 46)">Sabiduria</text>
      <text x="185" y="68" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(3, 185, 68)">Cultura</text>
    </g>
  </g>

  <!-- Border around Inner Circle -->
  <circle cx="300" cy="300" r="205" fill="none" stroke="#1e293b" stroke-width="5" />

  <!-- Circular Text in Navy Border -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">INSTITUCIÓN EDUCATIVA</textPath>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">DENZIL ESCOLAR</textPath>
  </text>
</svg>